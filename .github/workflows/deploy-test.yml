name: 🎺 Deploy Tour Plugin to TEST Website
on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: 📂 Sync files
        uses: webitsbr/github-to-ftp@1.0.1
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USER_TEST }}
          password: ${{ secrets.PASSWORD_TEST }}
          # Remove stale files from previous deployments (e.g. deleted PHP files
          # that would otherwise remain on the server and cause redeclare errors).
          dangerous-clean-slate: true
          local-dir: ./
          server-dir: ./wp-content/plugins/trombongos_tour_wp/
          exclude: .git*/**
